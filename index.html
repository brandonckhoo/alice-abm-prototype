<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alice ABM Workflows — 11x Prototype</title>
<style>
/* ─── 11x Design Tokens ─── */
:root {
  --shell-bg: #141F1A;
  --shell-bg-end: #141F1A;
  --surface: #FFFFFF;
  --surface-warm: #F6F3EA;
  --surface-warm-2: #F0ECE2;
  --border: #E7E3DA;
  --border-light: #F0ECE6;
  --text-primary: #1E2321;
  --text-secondary: #4A5350;
  --text-muted: #6B7370;
  --text-light: #9CA3A0;
  --accent: #2E6F6B;
  --accent-hover: #245C58;
  --accent-light: rgba(46,111,107,0.08);
  --accent-lighter: rgba(46,111,107,0.04);
  --success: #3A8B66;
  --success-bg: rgba(58,139,102,0.08);
  --warning: #C4880D;
  --warning-bg: rgba(196,136,13,0.08);
  --danger: #C44D4D;
  --danger-bg: rgba(196,77,77,0.08);
  --signal-hot: #E8553A;
  --signal-warm: #D4922A;
  --signal-cold: #8B9A96;
  --radius-xl: 24px;
  --radius-lg: 16px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --radius-pill: 100px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-modal: 0 16px 48px rgba(0,0,0,0.12);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --transition-fast: 150ms ease;
  --transition-med: 220ms ease;
}

/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font);
  background: var(--shell-bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }

/* ─── Layout ─── */
.app { display: flex; width: 100%; min-height: 100vh; }

/* ─── Sidebar ─── */
.sidebar {
  width: 60px;
  min-width: 60px;
  background: #FCFCFC;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0 20px;
}
.sidebar-top-icon {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: rgba(30,35,33,0.4);
  cursor: pointer;
  transition: color var(--transition-fast);
  margin-bottom: 20px;
}
.sidebar-top-icon:hover { color: var(--text-primary); }
.sidebar-top-icon svg { width: 18px; height: 18px; }
.sidebar-nav { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.sidebar-item {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  color: rgba(30,35,33,0.4);
  transition: all var(--transition-fast);
  cursor: pointer;
  position: relative;
}
.sidebar-item:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }
.sidebar-item.active { background: rgba(46,111,107,0.10); color: var(--accent); }
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-divider {
  width: 28px;
  height: 1px;
  background: var(--border-light);
  margin: 8px 0;
}
.sidebar-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.sidebar-logo-mark {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 12px;
  opacity: 0.7;
}
/* Tooltip on hover */
.sidebar-item[data-tooltip] { position: relative; }
.sidebar-item[data-tooltip]:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  background: #1a1c1e;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  pointer-events: none;
  z-index: 100;
  box-shadow: var(--shadow-md);
}

/* ─── Main Content ─── */
.main {
  flex: 1;
  padding: 0;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.content-surface {
  flex: 1;
  background: var(--surface);
  border-radius: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ─── Breadcrumb ─── */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 16px 32px 0;
  font-size: 12px;
  color: var(--text-light);
}
.breadcrumb a, .breadcrumb span { color: var(--text-light); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--text-muted); }
.breadcrumb .crumb-current { color: var(--text-secondary); font-weight: 600; }
.breadcrumb .sep { color: var(--border); }

/* ─── Page Header ─── */
.page-header {
  padding: 28px 32px 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.page-header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text-primary);
  line-height: 1.2;
}
.page-header p {
  color: var(--text-muted);
  font-size: 13px;
  margin-top: 4px;
}
.page-header-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ─── Buttons ─── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  transition: all var(--transition-fast);
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary {
  background: var(--surface);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--surface-warm); }
.btn-ghost {
  color: var(--text-muted);
  padding: 8px 10px;
}
.btn-ghost:hover { color: var(--text-primary); background: rgba(0,0,0,0.03); }
.btn svg { width: 16px; height: 16px; }

/* ─── Stats Bar ─── */
.stats-bar {
  display: flex;
  gap: 1px;
  padding: 20px 32px;
  background: var(--surface);
}
.stat-card {
  flex: 1;
  padding: 16px 20px;
  background: var(--surface-warm);
  border-radius: var(--radius-md);
}
.stat-card:first-child { border-radius: var(--radius-md) var(--radius-sm) var(--radius-sm) var(--radius-md); }
.stat-card:last-child { border-radius: var(--radius-sm) var(--radius-md) var(--radius-md) var(--radius-sm); }
.stat-card + .stat-card { margin-left: 8px; }
.stat-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-top: 4px; letter-spacing: -0.5px; }
.stat-change { font-size: 11px; font-weight: 600; margin-top: 2px; }
.stat-change.up { color: var(--success); }
.stat-change.down { color: var(--danger); }

/* ─── Toolbar ─── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 32px 16px;
}
.search-input {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-warm);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  flex: 1;
  max-width: 320px;
  transition: border-color var(--transition-fast);
}
.search-input:focus-within { border-color: var(--accent); }
.search-input svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
.search-input input {
  border: none;
  background: none;
  outline: none;
  font-size: 13px;
  color: var(--text-primary);
  width: 100%;
}
.search-input input::placeholder { color: var(--text-light); }
.filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all var(--transition-fast);
}
.filter-btn:hover { background: var(--surface-warm); }
.filter-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.filter-btn svg { width: 14px; height: 14px; }

/* ─── Tabs ─── */
.tabs {
  display: flex;
  gap: 0;
  padding: 0 32px;
  border-bottom: 1px solid var(--border-light);
}
.tab {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all var(--transition-fast);
  cursor: pointer;
}
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ─── Table ─── */
.table-wrap { flex: 1; overflow: auto; padding: 0 32px 24px; }
table { width: 100%; border-collapse: collapse; }
thead th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  padding: 12px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-light);
  position: sticky;
  top: 0;
  background: var(--surface);
}
thead th:last-child { text-align: right; }
tbody tr {
  cursor: pointer;
  transition: background var(--transition-fast);
}
tbody tr:hover { background: var(--accent-lighter); }
tbody td {
  padding: 14px 12px;
  font-size: 13px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}
tbody td:last-child { text-align: right; }
.account-name { font-weight: 600; color: var(--text-primary); }
.account-domain { color: var(--text-muted); font-size: 12px; }
.account-cell { display: flex; flex-direction: column; gap: 2px; }

/* ─── Signal Score ─── */
.signal-score {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 13px;
}
.signal-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.signal-hot .signal-dot { background: var(--signal-hot); }
.signal-hot { color: var(--signal-hot); }
.signal-warm .signal-dot { background: var(--signal-warm); }
.signal-warm { color: var(--signal-warm); }
.signal-cold .signal-dot { background: var(--signal-cold); }
.signal-cold { color: var(--signal-cold); }

/* ─── Badges ─── */
.badge-sm {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 600;
}
.badge-engaged { background: var(--success-bg); color: var(--success); }
.badge-prospecting { background: var(--accent-light); color: var(--accent); }
.badge-new { background: var(--surface-warm); color: var(--text-muted); }
.badge-paused { background: var(--warning-bg); color: var(--warning); }

/* ─── Progress Mini ─── */
.progress-mini { display: flex; align-items: center; gap: 8px; }
.progress-track {
  flex: 1;
  height: 4px;
  background: var(--border-light);
  border-radius: 2px;
  max-width: 80px;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-label { font-size: 12px; color: var(--text-muted); font-weight: 600; min-width: 28px; }

/* ─── Account Detail ─── */
.detail-layout { display: flex; flex: 1; overflow: hidden; }
.detail-left {
  width: 360px;
  min-width: 360px;
  border-right: 1px solid var(--border-light);
  overflow-y: auto;
  padding: 28px 24px;
}
.detail-right { flex: 1; overflow-y: auto; padding: 28px 32px; }

.detail-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  margin-bottom: 20px;
  transition: color var(--transition-fast);
}
.detail-back:hover { color: var(--text-primary); }
.detail-back svg { width: 14px; height: 14px; }

.detail-company-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.4px;
  margin-bottom: 4px;
}
.detail-domain { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

.detail-section { margin-bottom: 24px; }
.detail-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  margin-bottom: 10px;
}
.detail-info-grid { display: flex; flex-direction: column; gap: 8px; }
.detail-info-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}
.detail-info-row .label { color: var(--text-muted); }
.detail-info-row .value { font-weight: 600; color: var(--text-primary); }

.signal-list { display: flex; flex-direction: column; gap: 6px; }
.signal-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface-warm);
  border-radius: var(--radius-sm);
  font-size: 12px;
}
.signal-item .signal-icon { font-size: 14px; }
.signal-item .signal-text { flex: 1; color: var(--text-secondary); }
.signal-item .signal-time { color: var(--text-light); font-size: 11px; }

/* ─── Contact Cards ─── */
.contact-grid { display: flex; flex-direction: column; gap: 8px; }
.contact-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  transition: all var(--transition-fast);
  cursor: pointer;
}
.contact-card:hover { border-color: var(--accent); background: var(--accent-lighter); }
.contact-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent-light);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-weight: 600; font-size: 13px; color: var(--text-primary); }
.contact-title { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-status {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  flex-shrink: 0;
}
.contact-channel {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
}

/* ─── Campaign Builder ─── */
.builder-steps {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 20px 32px;
  border-bottom: 1px solid var(--border-light);
}
.step {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
}
.step.active { color: var(--accent); }
.step.completed { color: var(--success); }
.step-number {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  border: 2px solid var(--border);
  color: var(--text-light);
}
.step.active .step-number { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.step.completed .step-number { border-color: var(--success); color: #fff; background: var(--success); }
.step-connector {
  width: 40px;
  height: 2px;
  background: var(--border-light);
  margin: 0 8px;
}
.step-connector.done { background: var(--success); }
.builder-body { flex: 1; overflow-y: auto; padding: 28px 32px; }
.builder-body h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px; }
.builder-body .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

.form-group { margin-bottom: 20px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--surface);
  transition: border-color var(--transition-fast);
  outline: none;
}
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--text-light); }
select.form-input { cursor: pointer; }
textarea.form-input { resize: vertical; min-height: 80px; }

.persona-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.persona-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.persona-tag:hover { border-color: var(--accent); color: var(--accent); }
.persona-tag.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

.builder-footer {
  display: flex;
  justify-content: space-between;
  padding: 16px 32px;
  border-top: 1px solid var(--border-light);
}

/* ─── Campaign Timeline ─── */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border-light);
}
.timeline-item {
  position: relative;
  padding-bottom: 24px;
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-node {
  position: absolute;
  left: -28px;
  top: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}
.timeline-node.sent { border-color: var(--accent); background: var(--accent); }
.timeline-node.sent svg { color: #fff; }
.timeline-node.replied { border-color: var(--success); background: var(--success); }
.timeline-node.replied svg { color: #fff; }
.timeline-node.scheduled { border-color: var(--text-light); }
.timeline-node svg { width: 10px; height: 10px; }
.timeline-content {
  padding: 10px 14px;
  background: var(--surface-warm);
  border-radius: var(--radius-md);
}
.timeline-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.timeline-header .name { font-weight: 600; font-size: 13px; }
.timeline-header .time { font-size: 11px; color: var(--text-light); }
.timeline-body { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.timeline-meta {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-light);
}
.timeline-meta span { display: flex; align-items: center; gap: 4px; }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all var(--transition-med);
}
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 480px;
  max-width: 90vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow-modal);
  transform: translateY(8px);
  transition: transform var(--transition-med);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-light);
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  transition: all var(--transition-fast);
}
.modal-close:hover { background: var(--surface-warm); color: var(--text-primary); }
.modal-body { padding: 20px 24px; }
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 16px 24px;
  border-top: 1px solid var(--border-light);
}

/* ─── Import Preview ─── */
.import-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.import-zone:hover { border-color: var(--accent); background: var(--accent-lighter); }

function renderContent() {
  switch(currentView) {
    case 'accounts': return renderAccountsDashboard();
    case 'account-detail': return renderAccountDetail();
    case 'campaigns': return renderCampaignsList();
    case 'campaign-builder': return renderCampaignBuilder();
    case 'campaign-detail': return renderCampaignDetail();
    default: return renderAccountsDashboard();
  }
}

function renderCampaignsList() {
  const active = CAMPAIGNS_LIST.filter(c => c.status === 'active').length;
  const totalMeetings = CAMPAIGNS_LIST.reduce((s, c) => s + c.meetings, 0);
  const totalReplied = CAMPAIGNS_LIST.reduce((s, c) => s + c.replied, 0);
  const totalSent = CAMPAIGNS_LIST.reduce((s, c) => s + c.sent, 0);

  return `
    <div class="page-header">
      <div>
        <h1>ABM Campaigns</h1>
        <p>${CAMPAIGNS_LIST.length} campaigns · ${active} active</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary" data-action="new-campaign">${icons.plus} New ABM Campaign</button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-label">Active Campaigns</div><div class="stat-value">${active}</div><div class="stat-change up">running now</div></div>
      <div class="stat-card"><div class="stat-label">Messages Sent</div><div class="stat-value">${totalSent}</div><div class="stat-change up">across all campaigns</div></div>
      <div class="stat-card"><div class="stat-label">Replies</div><div class="stat-value">${totalReplied}</div><div class="stat-change up">${Math.round(totalReplied/totalSent*100)}% reply rate</div></div>
      <div class="stat-card"><div class="stat-label">Meetings Booked</div><div class="stat-value">${totalMeetings}</div><div class="stat-change up">this quarter</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Campaign</th>
          <th>Personas</th>
          <th>Accounts</th>
          <th>Sent</th>
          <th>Open Rate</th>
          <th>Replies</th>
          <th>Meetings</th>
          <th>Status</th>
        </tr></thead>
        <tbody>
          ${CAMPAIGNS_LIST.map(c => `
            <tr data-campaign="${c.id}">
              <td>
                <div class="account-cell">
                  <span class="account-name">${c.name}</span>
                  <span class="account-domain">${c.channels} · Started ${c.created}</span>
                </div>
              </td>
              <td>
                <div style="display:flex;gap:4px;flex-wrap:wrap">
                  ${c.personas.map(p => `<span style="font-size:11px;padding:2px 7px;border-radius:var(--radius-pill);background:var(--accent-light);color:var(--accent);font-weight:600">${p.split(' ').slice(-1)[0]}</span>`).join('')}
                </div>
              </td>
              <td style="font-weight:600">${c.accounts}</td>
              <td style="font-weight:600">${c.sent}</td>
              <td>
                <div class="progress-mini">
                  <div class="progress-track"><div class="progress-fill" style="width:${Math.round(c.opened/c.sent*100)}%"></div></div>
                  <span class="progress-label">${Math.round(c.opened/c.sent*100)}%</span>
                </div>
              </td>
              <td style="font-weight:${c.replied > 0 ? '700' : '400'};color:${c.replied > 0 ? 'var(--success)' : 'var(--text-light)'}">${c.replied}</td>
              <td style="font-weight:${c.meetings > 0 ? '700' : '400'};color:${c.meetings > 0 ? 'var(--success)' : 'var(--text-light)'}">${c.meetings}</td>
              <td><span class="badge-sm ${c.status === 'active' ? 'badge-engaged' : 'badge-prospecting'}">${c.status === 'active' ? 'Active' : 'Prospecting'}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderAccountsDashboard() {
  const filtered = ACCOUNTS.filter(a => {
    const matchesSearch = a.name.toLowerCase().includes(searchQuery.toLowerCase()) || a.domain.toLowerCase().includes(searchQuery.toLowerCase());
    const matchesFilter = filterSignal === 'all' || a.signalLevel === filterSignal;
    return matchesSearch && matchesFilter;
  });

  return `
    <div class="page-header">
      <div>
        <h1>Target Accounts</h1>
        <p>${ACCOUNTS.length} accounts across ${new Set(ACCOUNTS.map(a=>a.industry)).size} industries</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-secondary" data-action="import">${icons.upload} Import Accounts</button>
        <button class="btn btn-primary" data-action="new-campaign">${icons.plus} New ABM Campaign</button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-label">Total Accounts</div><div class="stat-value">${ACCOUNTS.length}</div><div class="stat-change up">+12 this week</div></div>
      <div class="stat-card"><div class="stat-label">Contacts Discovered</div><div class="stat-value">48</div><div class="stat-change up">+8 auto-prospected</div></div>
      <div class="stat-card"><div class="stat-label">Active Threads</div><div class="stat-value">14</div><div class="stat-change up">across 4 accounts</div></div>
      <div class="stat-card"><div class="stat-label">Meetings Booked</div><div class="stat-value">3</div><div class="stat-change up">+2 this week</div></div>
    </div>
    <div class="toolbar">
      <div class="search-input">
        ${icons.search}
        <input type="text" placeholder="Search accounts..." value="${searchQuery}" data-action="search">
      </div>
      <button class="filter-btn ${filterSignal === 'all' ? 'active' : ''}" data-filter="all">All</button>
      <button class="filter-btn ${filterSignal === 'hot' ? 'active' : ''}" data-filter="hot"><span class="signal-dot" style="background:var(--signal-hot);width:6px;height:6px;border-radius:50%;display:inline-block"></span> Hot</button>
      <button class="filter-btn ${filterSignal === 'warm' ? 'active' : ''}" data-filter="warm"><span class="signal-dot" style="background:var(--signal-warm);width:6px;height:6px;border-radius:50%;display:inline-block"></span> Warm</button>
      <button class="filter-btn ${filterSignal === 'cold' ? 'active' : ''}" data-filter="cold"><span class="signal-dot" style="background:var(--signal-cold);width:6px;height:6px;border-radius:50%;display:inline-block"></span> Cold</button>
    </div>
    <div class="table-wrap">
      ${filtered.length === 0 ? `
        <div class="empty-state">
          ${icons.search}
          <h3>No accounts found</h3>
          <p>Try adjusting your search or filters, or import new accounts.</p>
          <button class="btn btn-primary" data-action="import">${icons.plus} Import Accounts</button>
        </div>
      ` : `
      <table>
        <thead><tr>
          <th>Account</th>
          <th>Signal Score</th>
          <th>Status</th>
          <th>Contacts</th>
          <th>Threads Active</th>
          <th>Meetings</th>
          <th>Campaign</th>
        </tr></thead>
        <tbody>
          ${filtered.map(a => `
            <tr data-account="${a.id}">
              <td><div class="account-cell"><span class="account-name">${a.name}</span><span class="account-domain">${a.domain} · ${a.industry}</span></div></td>
              <td><span class="signal-score signal-${a.signalLevel}"><span class="signal-dot"></span>${a.signal}</span></td>
              <td><span class="badge-sm badge-${a.status}">${a.status.charAt(0).toUpperCase() + a.status.slice(1)}</span></td>
              <td>${a.contacts}</td>
              <td>${a.threaded > 0 ? `<div class="progress-mini"><div class="progress-track"><div class="progress-fill" style="width:${(a.threaded/a.contacts)*100}%"></div></div><span class="progress-label">${a.threaded}/${a.contacts}</span></div>` : '<span style="color:var(--text-light)">—</span>'}</td>
              <td>${a.meetings > 0 ? `<span style="font-weight:700;color:var(--success)">${a.meetings}</span>` : '<span style="color:var(--text-light)">0</span>'}</td>
              <td>${a.campaign !== '—' ? `<span style="color:var(--text-secondary);font-size:12px">${a.campaign}</span>` : '<span style="color:var(--text-light)">—</span>'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
    ${renderImportModal()}
  `;
}

function renderAccountDetail() {
  const a = selectedAccount || ACCOUNTS[0];
  const people = a.people || ACCOUNTS[0].people;
  const signals = a.signals || ACCOUNTS[0].signals;

  return `
    <div class="detail-layout">
      <div class="detail-left">
        <div class="detail-back" data-action="back-to-accounts" style="display:none">${icons.back} All Accounts</div>
        <div class="detail-company-name">${a.name}</div>
        <div class="detail-domain">${a.domain}</div>

        <div class="detail-section">
          <div class="detail-section-title">Account Info</div>
          <div class="detail-info-grid">
            <div class="detail-info-row"><span class="label">Industry</span><span class="value">${a.industry}</span></div>
            <div class="detail-info-row"><span class="label">Employees</span><span class="value">${a.employees}</span></div>
            <div class="detail-info-row"><span class="label">HQ</span><span class="value">${a.hq}</span></div>
            <div class="detail-info-row"><span class="label">Signal Score</span><span class="value"><span class="signal-score signal-${a.signalLevel}"><span class="signal-dot"></span>${a.signal}</span></span></div>
            <div class="detail-info-row"><span class="label">Status</span><span class="value"><span class="badge-sm badge-${a.status}">${a.status.charAt(0).toUpperCase() + a.status.slice(1)}</span></span></div>
          </div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">Recent Signals</div>
          <div class="signal-list">
            ${signals.map(s => `
              <div class="signal-item">
                <span class="signal-icon">${s.icon}</span>
                <span class="signal-text">${s.text}</span>
                <span class="signal-time">${s.time}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="detail-section">
          <button class="btn btn-primary" style="width:100%" data-action="launch-campaign">${icons.campaigns} Launch ABM Campaign</button>
        </div>
      </div>

      <div class="detail-right">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <div>
            <h2 style="font-size:17px;font-weight:700;letter-spacing:-0.3px">Contacts at ${a.name}</h2>
            <p style="font-size:12px;color:var(--text-muted);margin-top:2px">${people.length} discovered · ${a.threaded} active threads</p>
          </div>
          <button class="btn btn-secondary" style="font-size:12px">${icons.plus} Add Contact</button>
        </div>

        <div class="tabs" style="padding:0;margin-bottom:16px">
          <div class="tab ${accountDetailTab === 'contacts' ? 'active' : ''}" data-account-tab="contacts">All Contacts</div>
          <div class="tab ${accountDetailTab === 'threads' ? 'active' : ''}" data-account-tab="threads">Active Threads</div>
          <div class="tab ${accountDetailTab === 'timeline' ? 'active' : ''}" data-account-tab="timeline">Timeline</div>
        </div>

        ${accountDetailTab === 'contacts' ? `
          <div class="contact-grid">
            ${people.map(p => `
              <div class="contact-card" data-action="view-campaign">
                <div class="contact-avatar">${p.initials}</div>
                <div class="contact-info">
                  <div class="contact-name">${p.name}</div>
                  <div class="contact-title">${p.title}</div>
                </div>
                <div class="contact-status">
                  <span class="badge-sm ${p.statusClass}">${p.status}</span>
                  <span class="contact-channel">${p.channel}</span>
                </div>
              </div>
            `).join('')}
          </div>
        ` : accountDetailTab === 'threads' ? `
          <div style="margin-bottom:12px;font-size:12px;color:var(--text-muted)">Contacts with live outreach running — sorted by engagement.</div>
          <div class="contact-grid">
            ${people.filter(p => ['Replied','Opened 3x','Connected','Sequenced'].includes(p.status)).map(p => `
              <div class="contact-card" data-action="view-campaign" style="flex-direction:column;align-items:stretch;gap:10px">
                <div style="display:flex;align-items:center;gap:12px">
                  <div class="contact-avatar">${p.initials}</div>
                  <div class="contact-info">
                    <div class="contact-name">${p.name}</div>
                    <div class="contact-title">${p.title}</div>
                  </div>
                  <span class="badge-sm ${p.statusClass}" style="flex-shrink:0">${p.status}</span>
                </div>
                <div style="background:var(--surface-warm);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--text-secondary);line-height:1.5">
                  ${p.status === 'Replied' ? '"Thanks for reaching out — this is timely. Can you share a case study?"' :
                    p.status === 'Opened 3x' ? 'Opened last email 3 times — no reply yet. Follow-up scheduled for tomorrow.' :
                    p.status === 'Connected' ? 'LinkedIn connection accepted. Email sequence starts tomorrow.' :
                    'Email + LinkedIn sequence running. Step 2 of 5 in progress.'}
                </div>
                <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-light)">
                  <span style="display:flex;align-items:center;gap:4px">
                    <span class="channel-badge" style="margin-left:0">${p.channel}</span>
                  </span>
                  <span>${p.status === 'Replied' ? 'Today, 11:42 AM' : p.status === 'Opened 3x' ? 'Today, 9:14 AM' : p.status === 'Connected' ? 'Yesterday, 3:20 PM' : 'Jan 28, 2:15 PM'}</span>
                </div>
              </div>
            `).join('')}
          </div>
        ` : `
          <div style="margin-bottom:12px;font-size:12px;color:var(--text-muted)">Full outreach history across all personas at this account.</div>
          <div class="timeline">
            ${CAMPAIGN_TIMELINE.map(t => `
              <div class="timeline-item">
                <div class="timeline-node ${t.status}">
                  ${t.status === 'sent' ? icons.mail : t.status === 'replied' ? icons.check : icons.clock}
                </div>
                <div class="timeline-content">
                  <div class="timeline-header">
                    <span class="name">${t.persona} · <span style="font-weight:400;color:var(--text-muted)">${t.role}</span></span>
                    <span class="time">${t.time}</span>
                  </div>
                  <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px">${t.action}</div>
                  <div class="timeline-body">${t.detail}</div>
                  <div class="timeline-meta">
                    <span><span class="channel-badge" style="margin-left:0">${t.channel}</span></span>
                    ${t.opens ? `<span>Opens: ${t.opens}</span>` : ''}
                    ${t.clicks ? `<span>Clicks: ${t.clicks}</span>` : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    </div>
  `;
}

function renderCampaignBuilder() {
  const steps = ['Select Accounts', 'Target Personas', 'Configure Messaging', 'Review & Launch'];
  const allPersonas = ['VP Sales', 'CRO', 'Head of RevOps', 'SDR Manager', 'VP Marketing', 'Dir. Sales Enablement'];

  return `
    <div class="page-header">
      <div>
        <h1>New ABM Campaign</h1>
        <p>Create coordinated multi-threaded outreach across target accounts</p>
      </div>
    </div>
    <div class="builder-steps">
      ${steps.map((s, i) => `
        <div class="step ${i < builderStep ? 'completed' : ''} ${i === builderStep ? 'active' : ''}">
          <div class="step-number">${i < builderStep ? '✓' : i + 1}</div>
          <span>${s}</span>
        </div>
        ${i < steps.length - 1 ? `<div class="step-connector ${i < builderStep ? 'done' : ''}"></div>` : ''}
      `).join('')}
    </div>
    <div class="builder-body">
      ${builderStep === 0 ? `
        <h2>Select Target Accounts</h2>
        <p class="subtitle">Choose which accounts to include in this ABM campaign.</p>
        <div class="form-group">
          <label class="form-label">Campaign Name</label>
          <input class="form-input" type="text" placeholder="e.g., Enterprise Fintech Q1" value="${campaignForm.name}" data-field="name">
        </div>
        <div class="form-group">
          <label class="form-label">Account Source</label>
          <select class="form-input" data-field="source">
            <option value="crm" ${campaignForm.source === 'crm' ? 'selected' : ''}>Import from Salesforce</option>
            <option value="csv" ${campaignForm.source === 'csv' ? 'selected' : ''}>Upload CSV</option>
            <option value="manual" ${campaignForm.source === 'manual' ? 'selected' : ''}>Select from existing accounts</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Selected Accounts</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
            ${ACCOUNTS.filter(a => selectedAccounts.includes(a.id)).map(a => `
              <span class="persona-tag selected" data-account-tag="${a.id}" style="cursor:pointer">${a.name} <span style="opacity:0.6">· ${a.signal}</span> <span style="opacity:0.7;margin-left:2px">✕</span></span>
            `).join('')}
            <div style="position:relative;display:inline-block">
              <span class="persona-tag ${showAddMoreDropdown ? 'selected' : ''}" data-action="toggle-add-more">+ Add more</span>
              ${showAddMoreDropdown ? `
                <div style="position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:100;min-width:200px;padding:4px 0">
                  ${ACCOUNTS.filter(a => !selectedAccounts.includes(a.id)).length === 0
                    ? `<div style="padding:10px 14px;font-size:12px;color:var(--text-muted)">All accounts selected</div>`
                    : ACCOUNTS.filter(a => !selectedAccounts.includes(a.id)).map(a => `
                      <div class="add-account-item" data-add-account="${a.id}" style="padding:9px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px">
                        <span style="font-weight:500">${a.name}</span>
                        <span style="color:var(--text-light);font-size:11px;font-weight:600">${a.signal}</span>
                      </div>
                    `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      ` : builderStep === 1 ? `
        <h2>Target Personas</h2>
        <p class="subtitle">Select which roles to target within each account. Alice will auto-prospect matching contacts.</p>
        <div class="form-group">
          <label class="form-label">Personas to Target</label>
          <div class="persona-tags">
            ${allPersonas.map(p => `
              <span class="persona-tag ${campaignForm.personas.includes(p) ? 'selected' : ''}" data-persona="${p}">${p}</span>
            `).join('')}
          </div>
        </div>
        <div class="form-group" style="margin-top:24px">
          <label class="form-label">Threading Strategy</label>
          <select class="form-input">
            <option selected>Staggered — Space outreach 2-3 days between personas</option>
            <option>Simultaneous — Reach all personas at once</option>
            <option>Sequential — Start with champion, then expand</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Channels</label>
          <div class="persona-tags">
            <span class="persona-tag ${selectedChannels.includes('Email') ? 'selected' : ''}" data-channel="Email">Email</span>
            <span class="persona-tag ${selectedChannels.includes('LinkedIn') ? 'selected' : ''}" data-channel="LinkedIn">LinkedIn</span>
            <span class="persona-tag ${selectedChannels.includes('Phone') ? 'selected' : ''}" data-channel="Phone">Phone</span>
          </div>
        </div>
      ` : builderStep === 2 ? `
        <h2>Configure Messaging</h2>
        <p class="subtitle">Alice will generate persona-specific messaging. Customize the angle for each role.</p>

        <div style="background:var(--surface-warm);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:20px;margin-bottom:28px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <div style="font-size:13px;font-weight:700;color:var(--text-primary)">Account Knowledge Base</div>
            <span style="font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-light);padding:2px 8px;border-radius:var(--radius-pill)">${campaignKB.length} document${campaignKB.length !== 1 ? 's' : ''} indexed</span>
          </div>
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px">Upload documents so Alice can reference your product, case studies, and sales materials when writing outreach for this campaign.</p>

          ${campaignKB.length > 0 ? `
            <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
              ${campaignKB.map((f, i) => `
                <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border-light)">
                  <span style="font-size:18px;flex-shrink:0">${f.icon}</span>
                  <div style="flex:1;min-width:0">
                    <div style="font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.name}</div>
                    <div style="font-size:11px;color:var(--text-light);margin-top:1px">${f.type}${f.size !== '—' ? ' · ' + f.size : ''}</div>
                  </div>
                  <span style="font-size:11px;font-weight:600;color:var(--success);background:var(--success-bg);padding:2px 8px;border-radius:var(--radius-pill);flex-shrink:0">Indexed</span>
                  <button data-remove-kb="${i}" style="color:var(--text-light);font-size:14px;padding:2px 6px;border-radius:var(--radius-sm);transition:all 150ms ease" class="kb-remove-btn">✕</button>
                </div>
              `).join('')}
            </div>
          ` : ''}

          <div class="import-zone" data-action="kb-upload" style="padding:18px 24px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:28px;height:28px;color:var(--text-light);margin-bottom:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <p style="font-size:13px;color:var(--text-muted)">Drop files here or <span style="color:var(--accent);font-weight:600">browse</span></p>
            <p class="hint">PDF, DOCX, TXT, URLs · Case studies, product docs, sales calls, website pages</p>
          </div>
        </div>

        ${campaignForm.personas.map(p => `
          <div class="persona-thread">
            <div class="persona-thread-header">
              <div class="contact-avatar" style="width:32px;height:32px;font-size:11px">${p.split(' ').map(w=>w[0]).join('')}</div>
              <div>
                <div class="persona-thread-name">${p}</div>
                <div class="persona-thread-role">Auto-generated messaging</div>
              </div>
              <span class="channel-badge">Email + LinkedIn</span>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">Messaging Angle</label>
              <textarea class="form-input" placeholder="Alice will personalize based on account research. Add specific angles here...">${p === 'VP Sales' ? 'Focus on pipeline generation and SDR team augmentation. Reference their current tech stack and team size.' : p === 'CRO' ? 'Executive-level ROI angle. Reference industry benchmarks and competitor adoption.' : ''}</textarea>
            </div>
          </div>
        `).join('')}
      ` : `
        <h2>Review & Launch</h2>
        <p class="subtitle">Confirm your campaign settings before Alice begins outreach.</p>

}

        <label class="form-label">Import Filter</label>

      </div>

        <div style="font-weight:600;margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-light)">Required columns</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">

        </div>
        <div style="font-weight:600;margin-bottom:6px;margin-top:10px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-light)">Optional columns</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${['industry', 'employees', 'hq', 'owner', 'crm_id', 'priority'].map(c => `<code style="background:var(--surface);border:1px solid var(--border);padding:2px 7px;border-radius:4px;font-size:11px;color:var(--text-muted)">${c}</code>`).join('')}
        </div>

        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-light);margin-bottom:6px">Endpoint</div>
        <div style="display:flex;align-items:center;gap:8px;background:var(--surface-warm);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:10px 14px">

        </div>
      </div>
      <div style="margin-bottom:14px">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-light);margin-bottom:6px">Request body</div>
        <pre style="background:#1a1c1e;color:#a8d8a8;border-radius:var(--radius-md);padding:16px;font-size:12px;overflow-x:auto;line-height:1.6;margin:0">{
  <span style="color:#6eb5ff">"accounts"</span>: [
    {
      <span style="color:#6eb5ff">"name"</span>: <span style="color:#f9c274">"Stripe"</span>,
      <span style="color:#6eb5ff">"domain"</span>: <span style="color:#f9c274">"stripe.com"</span>,

    }
  ],
  <span style="color:#6eb5ff">"auto_prospect"</span>: <span style="color:#c084fc">true</span>   <span style="color:#666">// Alice finds contacts</span>

// ─── Event Binding ───
function bindEvents() {
  // Navigation (sidebar + breadcrumb links)
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); currentView = el.dataset.nav; selectedAccount = null; accountDetailTab = 'contacts'; render(); };
  });

  // Account detail tabs
  document.querySelectorAll('[data-account-tab]').forEach(el => {
    el.onclick = () => { accountDetailTab = el.dataset.accountTab; render(); };
  });

  // Import modal tabs
  document.querySelectorAll('[data-import-tab]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); importModalTab = el.dataset.importTab; render(); };
  });

  // Campaign row click
  document.querySelectorAll('[data-campaign]').forEach(el => {
    el.onclick = () => { currentView = 'campaign-detail'; render(); };
  });

  // Account row click
  document.querySelectorAll('[data-account]').forEach(el => {
    el.onclick = () => {
      selectedAccount = ACCOUNTS.find(a => a.id === parseInt(el.dataset.account));
      currentView = 'account-detail';
      render();
    };
  });

  // Actions
  document.querySelectorAll('[data-action]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      switch(el.dataset.action) {
        case 'back-to-accounts':
          currentView = 'accounts';
          selectedAccount = null;
          builderStep = 0;
          accountDetailTab = 'contacts';
          render();
          break;
        case 'import':
          importModalOpen = true;
          render();
          break;
        case 'close-modal':
          importModalOpen = false;
          importModalTab = 'crm';
          render();
          break;
        case 'confirm-import':
          importModalOpen = false;
          showToast('24 accounts imported from Salesforce', 'success');
          render();
          break;
        case 'toggle-sidebar':
          sidebarCollapsed = !sidebarCollapsed;
          render();
          break;
        case 'toggle-add-more':
          showAddMoreDropdown = !showAddMoreDropdown;
          render();
          break;
        case 'kb-upload':
          if (mockKBIndex < MOCK_KB_FILES.length) {
            campaignKB.push(MOCK_KB_FILES[mockKBIndex]);
            mockKBIndex++;
            showToast('Document indexed — Alice will use this for personalization', 'success');
            render();
          } else {
            showToast('All sample files uploaded', 'info');
          }
          break;
        case 'new-campaign':
        case 'launch-campaign':
          currentView = 'campaign-builder';
          builderStep = 0;
          render();
          break;
        case 'builder-next':
          if (builderStep < 3) { builderStep++; render(); }
          break;
        case 'builder-prev':
          if (builderStep > 0) { builderStep--; render(); }
          break;
        case 'launch-campaign-confirm':
          showToast('Campaign launched! Alice is prospecting contacts...', 'success');
          currentView = 'campaign-detail';
          render();
          break;
        case 'view-campaign':
          currentView = 'campaign-detail';
          render();
          break;
      }
    };
  });

  // Search
  const searchInput = document.querySelector('[data-action="search"]');
  if (searchInput) {
    searchInput.oninput = (e) => { searchQuery = e.target.value; render(); };
  }

  // Filters
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.onclick = () => { filterSignal = el.dataset.filter; render(); };
  });

  // Persona tags
  document.querySelectorAll('[data-persona]').forEach(el => {
    el.onclick = () => {
      const p = el.dataset.persona;
      if (campaignForm.personas.includes(p)) {
        campaignForm.personas = campaignForm.personas.filter(x => x !== p);
      } else {
        campaignForm.personas.push(p);
      }
      render();
    };
  });

  // Channel tags
  document.querySelectorAll('[data-channel]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const ch = el.dataset.channel;
      if (selectedChannels.includes(ch)) {
        selectedChannels = selectedChannels.filter(x => x !== ch);
      } else {
        selectedChannels.push(ch);
      }
      render();
    };
  });

  // Unselect account tags
  document.querySelectorAll('[data-account-tag]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(el.dataset.accountTag);
      selectedAccounts = selectedAccounts.filter(x => x !== id);
      render();
    };
  });

  // Remove KB file
  document.querySelectorAll('[data-remove-kb]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.removeKb);
      campaignKB.splice(i, 1);
      render();
    };
  });

  // Add account from dropdown
  document.querySelectorAll('[data-add-account]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(el.dataset.addAccount);
      if (!selectedAccounts.includes(id)) selectedAccounts.push(id);
      showAddMoreDropdown = false;
      render();
    };
  });

  // Form fields
  document.querySelectorAll('[data-field]').forEach(el => {
    el.oninput = (e) => { campaignForm[el.dataset.field] = e.target.value; };
  });
}

function showToast(message, type) {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `${type === 'success' ? '✓' : 'ℹ'} ${message}`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ─── Init ───
render();
</script>
</body>
</html>
