<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alice ABM Workflows — 11x Prototype</title>
<style>
/* ─── 11x Design Tokens ─── */
:root {
  --shell-bg: #141F1A;
  --shell-bg-end: #141F1A;
  --surface: #FFFFFF;
  --surface-warm: #F6F3EA;
  --surface-warm-2: #F0ECE2;
  --border: #E7E3DA;
  --border-light: #F0ECE6;
  --text-primary: #1E2321;
  --text-secondary: #4A5350;
  --text-muted: #6B7370;
  --text-light: #9CA3A0;
  --accent: #2E6F6B;
  --accent-hover: #245C58;
  --accent-light: rgba(46,111,107,0.08);
  --accent-lighter: rgba(46,111,107,0.04);
  --success: #3A8B66;
  --success-bg: rgba(58,139,102,0.08);
  --warning: #C4880D;
  --warning-bg: rgba(196,136,13,0.08);
  --danger: #C44D4D;
  --danger-bg: rgba(196,77,77,0.08);
  --signal-hot: #E8553A;
  --signal-warm: #D4922A;
  --signal-cold: #8B9A96;
  --radius-xl: 24px;
  --radius-lg: 16px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --radius-pill: 100px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-modal: 0 16px 48px rgba(0,0,0,0.12);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --transition-fast: 150ms ease;
  --transition-med: 220ms ease;
}

/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font);
  background: var(--shell-bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }

/* ─── Layout ─── */
.app { display: flex; width: 100%; min-height: 100vh; }

/* ─── Sidebar ─── */
.sidebar {
  width: 60px;
  min-width: 60px;
  background: #FCFCFC;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0 20px;
}
.sidebar-top-icon {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: rgba(30,35,33,0.4);
  cursor: pointer;
  transition: color var(--transition-fast);
  margin-bottom: 20px;
}
.sidebar-top-icon:hover { color: var(--text-primary); }
.sidebar-top-icon svg { width: 18px; height: 18px; }
.sidebar-nav { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.sidebar-item {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  color: rgba(30,35,33,0.4);
  transition: all var(--transition-fast);
  cursor: pointer;
  position: relative;
}
.sidebar-item:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }
.sidebar-item.active { background: rgba(46,111,107,0.10); color: var(--accent); }
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-divider {
  width: 28px;
  height: 1px;
  background: var(--border-light);
  margin: 8px 0;
}
.sidebar-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.sidebar-logo-mark {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 12px;
  opacity: 0.7;
}
/* Tooltip on hover */
.sidebar-item[data-tooltip] { position: relative; }
.sidebar-item[data-tooltip]:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  background: #1a1c1e;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  pointer-events: none;
  z-index: 100;
  box-shadow: var(--shadow-md);
}

/* ─── Main Content ─── */
.main {
  flex: 1;
  padding: 0;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.content-surface {
  flex: 1;
  background: var(--surface);
  border-radius: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ─── Breadcrumb ─── */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 16px 32px 0;
  font-size: 12px;
  color: var(--text-light);
}
.breadcrumb a, .breadcrumb span { color: var(--text-light); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--text-muted); }
.breadcrumb .crumb-current { color: var(--text-secondary); font-weight: 600; }
.breadcrumb .sep { color: var(--border); }

/* ─── Page Header ─── */
.page-header {
  padding: 28px 32px 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.page-header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text-primary);
  line-height: 1.2;
}
.page-header p {
  color: var(--text-muted);
  font-size: 13px;
  margin-top: 4px;
}
.page-header-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ─── Buttons ─── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  transition: all var(--transition-fast);
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary {
  background: var(--surface);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--surface-warm); }
.btn-ghost {
  color: var(--text-muted);
  padding: 8px 10px;
}
.btn-ghost:hover { color: var(--text-primary); background: rgba(0,0,0,0.03); }
.btn svg { width: 16px; height: 16px; }

/* ─── Stats Bar ─── */
.stats-bar {
  display: flex;
  gap: 1px;
  padding: 20px 32px;
  background: var(--surface);
}
.stat-card {
  flex: 1;
  padding: 16px 20px;
  background: var(--surface-warm);
  border-radius: var(--radius-md);
}
.stat-card:first-child { border-radius: var(--radius-md) var(--radius-sm) var(--radius-sm) var(--radius-md); }
.stat-card:last-child { border-radius: var(--radius-sm) var(--radius-md) var(--radius-md) var(--radius-sm); }
.stat-card + .stat-card { margin-left: 8px; }
.stat-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-top: 4px; letter-spacing: -0.5px; }
.stat-change { font-size: 11px; font-weight: 600; margin-top: 2px; }
.stat-change.up { color: var(--success); }
.stat-change.down { color: var(--danger); }

/* ─── Toolbar ─── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 32px 16px;
}
.search-input {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-warm);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  flex: 1;
  max-width: 320px;
  transition: border-color var(--transition-fast);
}
.search-input:focus-within { border-color: var(--accent); }
.search-input svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
.search-input input {
  border: none;
  background: none;
  outline: none;
  font-size: 13px;
  color: var(--text-primary);
  width: 100%;
}
.search-input input::placeholder { color: var(--text-light); }
.filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all var(--transition-fast);
}
.filter-btn:hover { background: var(--surface-warm); }
.filter-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.filter-btn svg { width: 14px; height: 14px; }

/* ─── Tabs ─── */
.tabs {
  display: flex;
  gap: 0;
  padding: 0 32px;
  border-bottom: 1px solid var(--border-light);
}
.tab {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all var(--transition-fast);
  cursor: pointer;
}
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ─── Table ─── */
.table-wrap { flex: 1; overflow: auto; padding: 0 32px 24px; }
table { width: 100%; border-collapse: collapse; }
thead th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  padding: 12px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-light);
  position: sticky;
  top: 0;
  background: var(--surface);
}
thead th:last-child { text-align: right; }
tbody tr {
  cursor: pointer;
  transition: background var(--transition-fast);
}
tbody tr:hover { background: var(--accent-lighter); }
tbody td {
  padding: 14px 12px;
  font-size: 13px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}
tbody td:last-child { text-align: right; }
.account-name { font-weight: 600; color: var(--text-primary); }
.account-domain { color: var(--text-muted); font-size: 12px; }
.account-cell { display: flex; flex-direction: column; gap: 2px; }

/* ─── Signal Score ─── */
.signal-score {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 13px;
}
.signal-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.signal-hot .signal-dot { background: var(--signal-hot); }
.signal-hot { color: var(--signal-hot); }
.signal-warm .signal-dot { background: var(--signal-warm); }
.signal-warm { color: var(--signal-warm); }
.signal-cold .signal-dot { background: var(--signal-cold); }
.signal-cold { color: var(--signal-cold); }

/* ─── Badges ─── */
.badge-sm {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 600;
}
.badge-engaged { background: var(--success-bg); color: var(--success); }
.badge-prospecting { background: var(--accent-light); color: var(--accent); }
.badge-new { background: var(--surface-warm); color: var(--text-muted); }
.badge-paused { background: var(--warning-bg); color: var(--warning); }

/* ─── Progress Mini ─── */
.progress-mini { display: flex; align-items: center; gap: 8px; }
.progress-track {
  flex: 1;
  height: 4px;
  background: var(--border-light);
  border-radius: 2px;
  max-width: 80px;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-label { font-size: 12px; color: var(--text-muted); font-weight: 600; min-width: 28px; }

/* ─── Account Detail ─── */
.detail-layout { display: flex; flex: 1; overflow: hidden; }
.detail-left {
  width: 360px;
  min-width: 360px;
  border-right: 1px solid var(--border-light);
  overflow-y: auto;
  padding: 28px 24px;
}
.detail-right { flex: 1; overflow-y: auto; padding: 28px 32px; }

.detail-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  margin-bottom: 20px;
  transition: color var(--transition-fast);
}
.detail-back:hover { color: var(--text-primary); }
.detail-back svg { width: 14px; height: 14px; }

.detail-company-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.4px;
  margin-bottom: 4px;
}
.detail-domain { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

.detail-section { margin-bottom: 24px; }
.detail-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  margin-bottom: 10px;
}
.detail-info-grid { display: flex; flex-direction: column; gap: 8px; }
.detail-info-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}
.detail-info-row .label { color: var(--text-muted); }
.detail-info-row .value { font-weight: 600; color: var(--text-primary); }

.signal-list { display: flex; flex-direction: column; gap: 6px; }
.signal-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface-warm);
  border-radius: var(--radius-sm);
  font-size: 12px;
}
.signal-item .signal-icon { font-size: 14px; }
.signal-item .signal-text { flex: 1; color: var(--text-secondary); }
.signal-item .signal-time { color: var(--text-light); font-size: 11px; }

/* ─── Contact Cards ─── */
.contact-grid { display: flex; flex-direction: column; gap: 8px; }
.contact-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  transition: all var(--transition-fast);
  cursor: pointer;
}
.contact-card:hover { border-color: var(--accent); background: var(--accent-lighter); }
.contact-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent-light);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-weight: 600; font-size: 13px; color: var(--text-primary); }
.contact-title { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-status {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  flex-shrink: 0;
}
.contact-channel {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
}

/* ─── Campaign Builder ─── */
.builder-steps {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 20px 32px;
  border-bottom: 1px solid var(--border-light);
}
.step {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
}
.step.active { color: var(--accent); }
.step.completed { color: var(--success); }
.step-number {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  border: 2px solid var(--border);
  color: var(--text-light);
}
.step.active .step-number { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.step.completed .step-number { border-color: var(--success); color: #fff; background: var(--success); }
.step-connector {
  width: 40px;
  height: 2px;
  background: var(--border-light);
  margin: 0 8px;
}
.step-connector.done { background: var(--success); }
.builder-body { flex: 1; overflow-y: auto; padding: 28px 32px; }
.builder-body h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px; }
.builder-body .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

.form-group { margin-bottom: 20px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--surface);
  transition: border-color var(--transition-fast);
  outline: none;
}
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--text-light); }
select.form-input { cursor: pointer; }
textarea.form-input { resize: vertical; min-height: 80px; }

.persona-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.persona-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.persona-tag:hover { border-color: var(--accent); color: var(--accent); }
.persona-tag.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

.builder-footer {
  display: flex;
  justify-content: space-between;
  padding: 16px 32px;
  border-top: 1px solid var(--border-light);
}

/* ─── Campaign Timeline ─── */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border-light);
}
.timeline-item {
  position: relative;
  padding-bottom: 24px;
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-node {
  position: absolute;
  left: -28px;
  top: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}
.timeline-node.sent { border-color: var(--accent); background: var(--accent); }
.timeline-node.sent svg { color: #fff; }
.timeline-node.replied { border-color: var(--success); background: var(--success); }
.timeline-node.replied svg { color: #fff; }
.timeline-node.scheduled { border-color: var(--text-light); }
.timeline-node svg { width: 10px; height: 10px; }
.timeline-content {
  padding: 10px 14px;
  background: var(--surface-warm);
  border-radius: var(--radius-md);
}
.timeline-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.timeline-header .name { font-weight: 600; font-size: 13px; }
.timeline-header .time { font-size: 11px; color: var(--text-light); }
.timeline-body { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.timeline-meta {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-light);
}
.timeline-meta span { display: flex; align-items: center; gap: 4px; }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all var(--transition-med);
}
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 480px;
  max-width: 90vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow-modal);
  transform: translateY(8px);
  transition: transform var(--transition-med);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-light);
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  transition: all var(--transition-fast);
}
.modal-close:hover { background: var(--surface-warm); color: var(--text-primary); }
.modal-body { padding: 20px 24px; }
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 16px 24px;
  border-top: 1px solid var(--border-light);
}

/* ─── Import Preview ─── */
.import-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.import-zone:hover { border-color: var(--accent); background: var(--accent-lighter); }

  const a = selectedAccount;
  let crumbs = '';

      crumbs = `<span class="current">Accounts</span>`;
      break;
    case 'account-detail':
      crumbs = `<span data-action="back-to-accounts">Accounts</span><span class="sep">/</span><span class="current">${a ? a.name : ''}</span>`;
      break;
    case 'campaigns':
      crumbs = `<span class="current">Campaigns</span>`;
      break;
    case 'campaign-builder':
      crumbs = `<span data-nav="campaigns">Campaigns</span><span class="sep">/</span><span class="current">New Campaign</span>`;

    case 'campaign-detail':
      crumbs = `<span data-nav="campaigns">Campaigns</span><span class="sep">/</span><span class="current">Enterprise Fintech Q1</span>`;
      break;
    case 'leads':
      crumbs = `<span class="current">Contacts</span>`;

function renderContent() {
  switch(currentView) {
    case 'accounts': return renderAccountsDashboard();
    case 'account-detail': return renderAccountDetail();
    case 'campaigns': return renderCampaignsList();
    case 'campaign-builder': return renderCampaignBuilder();

      <button class="filter-btn ${filterSignal === 'cold' ? 'active' : ''}" data-filter="cold"><span class="signal-dot" style="background:var(--signal-cold);width:6px;height:6px;border-radius:50%;display:inline-block"></span> Cold</button>
    </div>
    <div class="table-wrap">
      ${filtered.length === 0 ? `
        <div class="empty-state">
          ${icons.search}
          <h3>No accounts found</h3>
          <p>Try adjusting your search or filters, or import new accounts.</p>
          <button class="btn btn-primary" data-action="import">${icons.plus} Import Accounts</button>
        </div>
      ` : `
      <table>
        <thead><tr>
          <th>Account</th>
          <th>Signal Score</th>
          <th>Status</th>
          <th>Contacts</th>
          <th>Threads Active</th>
          <th>Meetings</th>
          <th>Campaign</th>
        </tr></thead>
        <tbody>
          ${filtered.map(a => `
            <tr data-account="${a.id}">
              <td><div class="account-cell"><span class="account-name">${a.name}</span><span class="account-domain">${a.domain} · ${a.industry}</span></div></td>
              <td><span class="signal-score signal-${a.signalLevel}"><span class="signal-dot"></span>${a.signal}</span></td>
              <td><span class="badge-sm badge-${a.status}">${a.status.charAt(0).toUpperCase() + a.status.slice(1)}</span></td>
              <td>${a.contacts}</td>
              <td>${a.threaded > 0 ? `<div class="progress-mini"><div class="progress-track"><div class="progress-fill" style="width:${(a.threaded/a.contacts)*100}%"></div></div><span class="progress-label">${a.threaded}/${a.contacts}</span></div>` : '<span style="color:var(--text-light)">—</span>'}</td>
              <td>${a.meetings > 0 ? `<span style="font-weight:700;color:var(--success)">${a.meetings}</span>` : '<span style="color:var(--text-light)">0</span>'}</td>
              <td>${a.campaign !== '—' ? `<span style="color:var(--text-secondary);font-size:12px">${a.campaign}</span>` : '<span style="color:var(--text-light)">—</span>'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

        ${accountDetailTab === 'contacts' ? `

          <div class="contact-grid">
            ${people.filter(p => ['Replied','Opened 3x','Connected','Sequenced'].includes(p.status)).map(p => `
              <div class="contact-card" data-action="view-campaign" style="flex-direction:column;align-items:stretch;gap:10px">
                <div style="display:flex;align-items:center;gap:12px">
                  <div class="contact-avatar">${p.initials}</div>
                  <div class="contact-info">
                    <div class="contact-name">${p.name}</div>

                <div style="background:var(--surface-warm);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--text-secondary);line-height:1.5">

                </div>

        ` : `
          <div style="margin-bottom:12px;font-size:12px;color:var(--text-muted)">Full outreach history across all personas at this account.</div>
          <div class="timeline">
            ${CAMPAIGN_TIMELINE.map(t => `
              <div class="timeline-item">
                <div class="timeline-node ${t.status}">
                  ${t.status === 'sent' ? icons.mail : t.status === 'replied' ? icons.check : icons.clock}
                </div>
                <div class="timeline-content">
                  <div class="timeline-header">
                    <span class="name">${t.persona} · <span style="font-weight:400;color:var(--text-muted)">${t.role}</span></span>
                    <span class="time">${t.time}</span>
                  </div>
                  <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px">${t.action}</div>
                  <div class="timeline-body">${t.detail}</div>
                  <div class="timeline-meta">
                    <span><span class="channel-badge" style="margin-left:0">${t.channel}</span></span>
                    ${t.opens ? `<span>Opens: ${t.opens}</span>` : ''}
                    ${t.clicks ? `<span>Clicks: ${t.clicks}</span>` : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    </div>
  `;
}

function renderCampaignBuilder() {
  const steps = ['Select Accounts', 'Target Personas', 'Configure Messaging', 'Review & Launch'];
  const allPersonas = ['VP Sales', 'CRO', 'Head of RevOps', 'SDR Manager', 'VP Marketing', 'Dir. Sales Enablement'];

        <span>📋</span><span>Using playbook: <strong>${campaignForm.playbookName}</strong></span>

      ${steps.map((s, i) => `
        <div class="step ${i < builderStep ? 'completed' : ''} ${i === builderStep ? 'active' : ''}">
          <div class="step-number">${i < builderStep ? '✓' : i + 1}</div>

      ${builderStep === 0 ? `

        <div style="margin-bottom:20px">
          <input class="form-input" type="text" placeholder="e.g., Enterprise Fintech Q1" value="${campaignForm.name}" data-field="name" style="margin-bottom:10px">

            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="color:var(--text-light);flex-shrink:0;margin-top:16px"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div style="display:flex;flex-direction:column;gap:4px">

            return days > 0 ? `<div style="margin-top:6px;font-size:12px;color:var(--text-muted)">Duration: <strong style="color:var(--text-secondary)">${weeks} week${weeks!==1?'s':''}</strong> · ${days} days</div>` : `<div style="margin-top:6px;font-size:12px;color:#C44D4D">End date must be after start date</div>`;
          })() : ''}

          <textarea class="form-input" data-field="goalDescription" rows="3" placeholder="Describe your goal so Alice can tailor outreach…&#10;e.g., Targeting fintech VP Sales ahead of our Series B. Goal is 10 qualified meetings with 200–500 employee companies that recently expanded their SDR team." style="resize:vertical;line-height:1.5">${campaignForm.goalDescription}</textarea>
        </div>

        <div style="border-top:1px solid var(--border-light);margin:4px 0 20px;"></div>

          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
            ${[
              { id: 'crm',    icon: '☁️', label: 'Salesforce',       sub: null },
              { id: 'csv',    icon: '📄', label: 'Upload CSV',        sub: null },

              const active = campaignForm.source === s.id;
              return `<div data-source-card="${s.id}" style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius-md);border:1.5px solid ${active ? 'var(--accent)' : 'var(--border)'};background:${active ? 'rgba(46,111,107,0.05)' : 'var(--surface)'};cursor:pointer;transition:all 150ms ease">

            <div style="max-height:220px;overflow-y:auto">
              ${filtered.length === 0 ? `<div style="padding:16px;text-align:center;font-size:13px;color:var(--text-muted)">No accounts match "${accountSearch}"</div>` :

                      ${sel ? `<svg width="9" height="7" viewBox="0 0 9 7"><path d="M1 3.5l2.5 2.5 5-5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}

                    <div style="flex:1;min-width:0">
                      <div style="font-size:13px;font-weight:${sel ? '600' : '500'};color:${sel ? 'var(--text-primary)' : 'var(--text-secondary)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.name}</div>

                    </div>
                    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                      <span style="font-size:11px;font-weight:700;color:${a.signal >= 80 ? '#C44D4D' : a.signal >= 65 ? '#C88C28' : 'var(--text-light)'}">${a.signal}</span>
                      <span style="font-size:10px;color:var(--text-light);font-weight:500">${a.status || 'New'}</span>

              <button data-action="toggle-all-accounts" style="font-size:12px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:0">${allFilteredSelected ? 'Deselect all' : 'Select all'} ${accountSearch ? 'filtered' : ''} (${filtered.length})</button>
              <span style="font-size:11px;color:var(--text-light)">${campaignForm.source === 'crm' ? '☁️ Salesforce · synced 2m ago' : campaignForm.source === 'csv' ? '📄 CSV upload' : '🗂️ Alice accounts'}</span>
            </div>
          </div>
          `;
        })()}
      ` : builderStep === 1 ? `

        <p class="subtitle">Select which roles to target within each account. Alice will auto-prospect matching contacts.</p>
        <div class="form-group">
          <label class="form-label">Personas to Target</label>
          <div class="persona-tags">
            ${allPersonas.map(p => `
              <span class="persona-tag ${campaignForm.personas.includes(p) ? 'selected' : ''}" data-persona="${p}">${p}</span>
            `).join('')}
          </div>
        </div>
        <div class="form-group" style="margin-top:24px">
          <label class="form-label">Threading Strategy</label>
          <select class="form-input">
            <option selected>Staggered — Space outreach 2-3 days between personas</option>
            <option>Simultaneous — Reach all personas at once</option>

        </div>
        <div class="form-group">
          <label class="form-label">Channels</label>
          <div class="persona-tags">
            <span class="persona-tag ${selectedChannels.includes('Email') ? 'selected' : ''}" data-channel="Email">Email</span>

              { id: 'zoominfo',  label: 'ZoomInfo',       icon: '🔍', note: 'Enterprise contact data', builtin: false },
              { id: 'clearbit',  label: 'Clearbit',       icon: '✨', note: 'Firmographic enrichment', builtin: false },
              { id: 'g2',        label: 'G2 / Bombora',   icon: '📊', note: 'Intent signals',          builtin: false },

// ─── Event Binding ───
function bindEvents() {
  // Navigation (sidebar + breadcrumb links)
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); currentView = el.dataset.nav; selectedAccount = null; accountDetailTab = 'contacts'; render(); };
  });

  // Account detail tabs
  document.querySelectorAll('[data-account-tab]').forEach(el => {
    el.onclick = () => { accountDetailTab = el.dataset.accountTab; render(); };
  });

  // Campaign detail tabs
  document.querySelectorAll('[data-campaign-tab]').forEach(el => {
    el.onclick = () => { campaignDetailTab = el.dataset.campaignTab; render(); };
  });

  // Analytics period toggle
  document.querySelectorAll('[data-analytics-period]').forEach(el => {
    el.onclick = () => { campaignAnalyticsPeriod = el.dataset.analyticsPeriod; render(); };
  });

  // Edit campaign panel section nav
  document.querySelectorAll('[data-edit-section]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); editCampaignSection = el.dataset.editSection; render(); };
  });

  // Contacts persona filter
  document.querySelectorAll('[data-contacts-filter]').forEach(el => {
    el.onclick = () => { contactsFilter = el.dataset.contactsFilter; render(); };
  });

  // Signals filters
  document.querySelectorAll('[data-signal-priority]').forEach(el => {
    el.onclick = () => { signalsPriorityFilter = el.dataset.signalPriority; render(); };
  });
  document.querySelectorAll('[data-signal-type]').forEach(el => {
    el.onclick = () => { signalsTypeFilter = signalsTypeFilter === el.dataset.signalType ? 'all' : el.dataset.signalType; render(); };
  });
  document.querySelectorAll('[data-signal-account]').forEach(el => {
    el.onclick = () => { signalsAccountFilter = signalsAccountFilter === el.dataset.signalAccount ? 'all' : el.dataset.signalAccount; render(); };
  });

  // Import modal tabs
  document.querySelectorAll('[data-import-tab]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); importModalTab = el.dataset.importTab; render(); };
  });

  // Campaign row click
  document.querySelectorAll('[data-campaign]').forEach(el => {
    el.onclick = () => { currentView = 'campaign-detail'; render(); };
  });

  // Account row click
  document.querySelectorAll('[data-account]').forEach(el => {
    el.onclick = () => {
      selectedAccount = ACCOUNTS.find(a => a.id === parseInt(el.dataset.account));
      currentView = 'account-detail';
      render();
    };
  });

  // Actions
  document.querySelectorAll('[data-action]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      switch(el.dataset.action) {
        case 'back-to-accounts':
          currentView = 'accounts';
          selectedAccount = null;
          builderStep = 0;
          accountDetailTab = 'contacts';
          render();
          break;
        case 'import':
          importModalOpen = true;
          render();
          break;
        case 'close-modal':
          importModalOpen = false;
          importModalTab = 'crm';
          render();
          break;
        case 'confirm-import':
          importModalOpen = false;
          showToast('24 accounts imported from Salesforce', 'success');
          render();
          break;
        case 'open-edit-campaign':
          showEditCampaignPanel = true;
          editCampaignSection = 'settings';
          render();
          break;
        case 'close-edit-campaign':
          showEditCampaignPanel = false;
          render();
          break;
        case 'save-edit-campaign':
          showEditCampaignPanel = false;
          showToast('Campaign updated — changes apply to future messages', 'success');
          render();
          break;
        case 'open-csv-modal':
          showCSVModal = true;
          render();
          break;
        case 'close-csv-modal':
          showCSVModal = false;
          render();
          break;
        case 'simulate-csv-upload':
          csvUploaded = true;
          showCSVModal = false;
          campaignForm.source = 'csv';
          showToast('12 accounts imported from CSV', 'success');
          render();
          break;
        case 'toggle-sidebar':
          sidebarCollapsed = !sidebarCollapsed;
          render();
          break;
        case 'toggle-add-more':
          showAddMoreDropdown = !showAddMoreDropdown;
          render();
          break;
        case 'toggle-all-accounts': {
          const sourceList = campaignForm.source === 'crm' ? CRM_ACCOUNTS : ACCOUNTS;
          const filtered = sourceList.filter(a => !accountSearch || a.name.toLowerCase().includes(accountSearch.toLowerCase()) || (a.industry||'').toLowerCase().includes(accountSearch.toLowerCase()));
          const allSel = filtered.every(a => selectedAccounts.includes(a.id));
          if (allSel) {
            selectedAccounts = selectedAccounts.filter(id => !filtered.find(a => a.id === id));
          } else {
            filtered.forEach(a => { if (!selectedAccounts.includes(a.id)) selectedAccounts.push(a.id); });
          }
          render();
          break;
        }
        case 'kb-upload':
          if (mockKBIndex < MOCK_KB_FILES.length) {
            campaignKB.push(MOCK_KB_FILES[mockKBIndex]);
            mockKBIndex++;
            showToast('Document indexed — Alice will use this for personalization', 'success');
            render();
          } else {
            showToast('All sample files uploaded', 'info');
          }
          break;
        case 'use-playbook': {
          const playbookId = parseInt(el.dataset.playbook);
          const playbook = PLAYBOOKS.find(p => p.id === playbookId);
          if (playbook) {
            campaignForm.personas = [...playbook.personas];
            campaignForm.playbookName = playbook.name;
          }
          currentView = 'campaign-builder';
          builderStep = 0;
          render();
          break;
        }
        case 'new-campaign':
        case 'launch-campaign':
          currentView = 'campaign-builder';
          builderStep = 0;
          campaignForm.playbookName = null;
          render();
          break;
        case 'builder-next':
          if (builderStep < 3) { builderStep++; render(); }
          break;
        case 'builder-prev':
          if (builderStep > 0) { builderStep--; render(); }
          break;
        case 'launch-campaign-confirm':
          showToast('Campaign launched! Alice is prospecting contacts...', 'success');
          currentView = 'campaign-detail';
          render();
          break;
        case 'view-campaign':
          currentView = 'campaign-detail';
          render();
          break;
      }
    };
  });

  // Search
  const searchInput = document.querySelector('[data-action="search"]');
  if (searchInput) {
    searchInput.oninput = (e) => { searchQuery = e.target.value; render(); };
  }

  // Filters
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.onclick = () => { filterSignal = el.dataset.filter; render(); };
  });

  // Persona tags
  document.querySelectorAll('[data-persona]').forEach(el => {
    el.onclick = () => {
      const p = el.dataset.persona;
      if (campaignForm.personas.includes(p)) {
        campaignForm.personas = campaignForm.personas.filter(x => x !== p);
      } else {
        campaignForm.personas.push(p);
      }
      render();
    };
  });

  // Account source card selection
  document.querySelectorAll('[data-source-card]').forEach(el => {
    el.onclick = () => {
      const src = el.dataset.sourceCard;
      campaignForm.source = src;
      if (src === 'csv') { showCSVModal = true; }
      render();
    };
  });

  // Campaign goal selection
  document.querySelectorAll('[data-goal]').forEach(el => {
    el.onclick = () => { campaignForm.goal = el.dataset.goal; render(); };
  });

  // Enrichment source toggles
  document.querySelectorAll('[data-enrich-toggle]').forEach(el => {
    el.onclick = () => {
      const src = el.dataset.enrichToggle;
      if (campaignForm.enrichmentSources.includes(src)) {
        campaignForm.enrichmentSources = campaignForm.enrichmentSources.filter(x => x !== src);
      } else {
        campaignForm.enrichmentSources.push(src);
      }
      render();
    };
  });

  // Channel tags
  document.querySelectorAll('[data-channel]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const ch = el.dataset.channel;
      if (selectedChannels.includes(ch)) {
        selectedChannels = selectedChannels.filter(x => x !== ch);
      } else {
        selectedChannels.push(ch);
      }
      render();
    };
  });

  // Unselect account tags
  document.querySelectorAll('[data-account-tag]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(el.dataset.accountTag);
      selectedAccounts = selectedAccounts.filter(x => x !== id);
      render();
    };
  });

  // Toggle account in checklist
  document.querySelectorAll('[data-toggle-account]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(el.dataset.toggleAccount);
      if (selectedAccounts.includes(id)) {
        selectedAccounts = selectedAccounts.filter(x => x !== id);
      } else {
        selectedAccounts.push(id);
      }
      render();
      // Restore focus/scroll on search input
      const inp = document.getElementById('account-search-input');
      if (inp) inp.focus();
    };
  });

  // Remove KB file
  document.querySelectorAll('[data-remove-kb]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.removeKb);
      campaignKB.splice(i, 1);
      render();
    };
  });

  // Add account from dropdown
  document.querySelectorAll('[data-add-account]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(el.dataset.addAccount);
      if (!selectedAccounts.includes(id)) selectedAccounts.push(id);
      showAddMoreDropdown = false;
      render();
    };
  });

  // Form fields
  document.querySelectorAll('[data-field]').forEach(el => {
    el.oninput = (e) => { campaignForm[el.dataset.field] = e.target.value; };
  });
}

function showToast(message, type) {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `${type === 'success' ? '✓' : 'ℹ'} ${message}`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ─── Init ───
render();
</script>
</body>
</html>
